<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{--ground:#FBFAF7;--ink:#16224A;--body:#2C3557;--muted:#5C6480;--rule:#E4E1D8;--accent:#B8860B}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0F1425;--ink:#E9ECF6;--body:#C8CDE0;--muted:#8B93AD;--rule:#283153;--accent:#FFD54A}}
  :root[data-theme="dark"]{--ground:#0F1425;--ink:#E9ECF6;--body:#C8CDE0;--muted:#8B93AD;--rule:#283153;--accent:#FFD54A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--body);
    font-family:"IBM Plex Sans KR",-apple-system,sans-serif;font-size:16px;line-height:1.72}
  .wrap{max-width:34rem;margin:0 auto;padding:4rem 1.5rem}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:"Noto Serif KR",Georgia,serif;color:var(--ink);font-size:1.8rem;
    line-height:1.25;margin:0 0 .7rem;text-wrap:balance}
  p{margin:0 0 2rem}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
  li{border-top:1px solid var(--rule)}
  li:last-child{border-bottom:1px solid var(--rule)}
  a{display:block;padding:1rem .2rem;color:var(--ink);text-decoration:none;
    display:flex;justify-content:space-between;align-items:center;gap:1rem}
  a:hover{color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .arrow{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
  footer{margin-top:2.5rem;font-size:.85rem;color:var(--muted)}
  footer a{display:inline;padding:0;color:var(--accent);text-decoration:underline}
</style>
<div class="wrap">
  <p class="eyebrow">그냥1분 · Publishing Tool</p>
